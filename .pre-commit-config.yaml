repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.9
    hooks:
      - id: ruff
        args: [--fix]
        types: [python]
        stages: [pre-commit]
      - id: ruff-format
        types: [python]
        stages: [pre-commit]

  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.10.0
    hooks:
      - id: python-no-eval
      - id: python-use-type-annotations

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: check-yaml
      - id: debug-statements

  - repo: local
    hooks:
      - id: check-todo
        name: Disallow TODO
        entry: bash -c 'if grep -r "TODO" --include="*.py" .; then exit 1; fi'
        language: system
        types: [python]
        stages: [pre-commit]

      - id: no-print-statements
        name: Disallow print() statements
        # entry: bash -c 'grep -r "print(" --include="*.py" . && exit 1 || exit 0'
        entry: bash -c 'grep -Hn "print(" "$@" && exit 1 || exit 0'
        language: system
        types: [python]
        stages: [pre-commit]

      - id: run-tests
        name: Run Unit Tests
        entry: pytest
        language: system
        pass_filenames: false
        always_run: true
        # args: ['--disable-warnings']
        stages: [pre-commit]