[project]
name = "pawdb"
version = "0.1.0"
description = "Utility package to access the miriad of dbs we need to access from our pipelines. (Miau & Ráció)"
authors = [{name = "partvishegy", email = "venczeli.jozsef@budapest.hu"}]
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pyodbc>=5.0.1",
    "pandas>=2.1.2",
    "dotenv>=0.9.9",
    "python-json-logger>=3.3.0",
]

[project.optional-dependencies]
dev = [
    "black>=25.1.0",
    "pre-commit>=4.2.0",
    "pytest>=8.3.5",
    "pytest-cov>=6.1.1",
    "mkdocs>=1.6.1",
    "mkdocstrings-python>=1.16.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
