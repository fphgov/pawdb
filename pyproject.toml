[tool.poetry]
name = "pawdb"
version = "0.1.0"
description = "Utility package to access the miriad of dbs we need to access from our pipelines. (Miau &amp; Ráció)"
authors = ["partvishegy <venczeli.jozsef@budapest.hu>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10,<3.11"


[tool.poetry.group.dev.dependencies]
black = "^25.1.0"
pre-commit = "^4.2.0"
pytest = "^8.3.5"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
